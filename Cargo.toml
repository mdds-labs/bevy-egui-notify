[package]
name = "bevy-egui-notify"
version = "0.16.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/soraxas/bevy-egui-notify"
description = "Simple notifications library for EGUI, in the bevy system"
authors = ["ItsEthra", "soraxas"]
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
# egui = { version = "0.31.1", default-features = false }
bevy_egui = { version = "0.34.0", default-features = false }
bevy = { version = "0.16", default-features = false, features = ["x11"] }
egui-notify = "0.19.0"

[dev-dependencies]
eframe = { version = "0.31.1", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui-phosphor = { version = "0.9.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 0 }
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
enum_glob_use = { level = "deny", priority = 2 }
